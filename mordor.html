<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>personal mordor — santerikalinen.com</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: url('assets/images/harja_cursor.png') 0 48, auto;
    }

    .back-link {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      opacity: 0.75;
      transition: opacity 0.3s;
      text-decoration: none;
    }

    .back-link:hover { opacity: 1; }

    .back-link img {
      height: 32px;
      width: auto;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,0.9));
    }

    .image-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>
  <a href="gallery.html" class="back-link"><img src="assets/images/nuoli.avif" alt="back" /></a>
  <div class="image-wrap">
    <img src="assets/images/Untitled design (6).png" alt="personal mordor" />
  </div>
</body>
</html>
